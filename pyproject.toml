[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "SST2"
version = "0.0.1+mdclaw.2"
dynamic = ["readme", "dependencies"]
description = "`SST2` is a python library designed to conduct Simulated Solute Tempering (SST2) simulations using the openmm library."
license = {text = "GPL-2.0"}
requires-python = ">=3.7"
authors = [
    { name = "Samuel Murail", email = "samuel.murail@u-paris.fr" },
]
keywords = [
        "Simulated Solute Tempering 2",
        "Simulated Tempering",
        "Molecular Dynamics",
        "Openmm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python",
    "Topic :: Software Development",
]

[project.optional-dependencies]
# OpenMM is usually installed from conda (conda-forge, or a CUDA-specific
# source build), which pip and uv cannot always recognise as providing the
# `openmm` distribution. Require it only on request: pip install "SST2[openmm]".
openmm = ["openmm>=7.7.0"]

[project.scripts]
sst2-from-xml = "SST2.driver:main"

[project.urls]
Homepage = "https://sst2.readthedocs.io"

[tool.setuptools.package-data]
# Small test systems (1.1 MB) so the installed package can be self-tested.
SST2 = ["tests/inputs/*.pdb"]

[tool.setuptools.dynamic]
# version = {attr = "SST2.VERSION"}
readme = {file = ["README.md"]}
dependencies = {file = ["requirements.txt"]}